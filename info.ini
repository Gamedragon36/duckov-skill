name = Dskill
displayName = Duckov Skill
description = [Multi-language support] Fully localized in all 10 game languages: Korean, English, Chinese (Simplified/Traditional), Japanese, German, Russian, Spanish, French and Portuguese-BR. Follows your in-game language automatically, or set it in config.ini. [한국어] Escape From Tarkov 스타일의 스킬 성장 시스템. 스킬 23종, 최대 Lv.20, 만렙 시 엘리트 효과. 총 쏘기, 달리기, 루팅, 낚시, 제작 등 모든 행동이 경험치가 되어 영구 패시브 보너스가 붙습니다. F6 스킬 창 (제목줄을 마우스로 끌어 이동), F7 계열 전환. 경험치는 세이브 슬롯별로 저장됩니다. 다른 세이브에서 키운 스킬 레벨이 이번 판의 경험치 획득 속도를 올려주는 계승(로그라이크) 시스템을 포함합니다. 모든 수치는 게임 폴더의 config.ini 로 조절할 수 있습니다. 게임 코드를 패치하지 않아 다른 모드와 충돌이 적습니다. AI 코딩 에이전트와 협업해 제작했습니다. [English] A Tarkov-style skill progression system for Escape From Duckov. 23 skills, max Lv.20, with Elite bonuses at max level. Shooting, sprinting, looting, fishing and crafting all grant skill XP that unlocks permanent passive bonuses. F6 opens the skill window (drag the title bar to move it), F7 switches category. XP is stored per save slot. Includes a roguelike inheritance system in which skills earned in other saves increase the XP gain rate of the current run. All values are configurable in config.ini next to the DLL. The mod does not patch game code, so it coexists well with other mods. Made in collaboration with an AI coding agent. [中文] 塔科夫风格的技能成长系统。共 23 种技能，最高 Lv.20，满级可获得精英效果。射击、疾跑、搜刮、钓鱼、制作等所有行动都会转化为经验值，并解锁永久被动加成。按 F6 打开技能窗口（可用鼠标拖动标题栏移动窗口），按 F7 切换类别。经验值按存档栏位分别保存。包含类 Roguelike 的继承系统：你在其他存档中培养的技能等级会提升当前这一局的经验获取速度。所有数值都可以在游戏目录的 config.ini 中调整。本模组不修改游戏代码，因此与其他模组冲突较少。本模组由 AI 编程助手协作制作。 [繁體中文] 塔科夫風格的技能成長系統。共 23 種技能，最高 Lv.20，滿級可獲得菁英效果。射擊、疾跑、搜刮、釣魚、製作等所有行動都會轉化為經驗值，並解鎖永久被動加成。按 F6 開啟技能視窗（可用滑鼠拖曳標題列移動視窗），按 F7 切換類別。經驗值依存檔欄位分別儲存。包含類 Roguelike 的繼承系統：你在其他存檔中培養的技能等級會提升當前這一局的經驗取得速度。所有數值都可以在遊戲目錄的 config.ini 中調整。本模組不修改遊戲程式碼，因此與其他模組衝突較少。本模組由 AI 程式助手協作製作。
