description = Escape From Tarkov 스타일의 캐릭터 스킬 시스템. 스킬 23종 / 최대 Lv.20 / 만렙 시 엘리트 효과. 행동으로 경험치를 얻고 레벨이 오르면 패시브 보너스가 붙습니다. 신체 - 근력·지구력·생명력·회복·신진대사·구르기·야간시야 / 전투 - 사격술·반동 제어·정밀 사격·근접 전투·투척술·인지/정찰 / 실용 - 은신 이동·방어·생존술·재장전·수리·흥정·파밍·하이드아웃·낚시·제작. 로그라이크 계승: 다른 세이브에서 키운 스킬 레벨이 이번 판의 경험치 획득 속도를 올려줍니다. F6 키로 스킬 창을 열고(제목줄을 마우스로 끌어 이동) F7 키로 계열을 전환합니다. 모든 수치는 게임 폴더의 config.ini 로 조절할 수 있습니다. ※ 이 모드의 코드와 설명은 AI의 도움을 받아 제작되었습니다.
