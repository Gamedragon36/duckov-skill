name = Dskill
displayName = Duckov Skill
description = 【한국어】 Escape From Tarkov 스타일의 스킬 성장 시스템. 스킬 23종 / 최대 Lv.20 / 만렙 시 엘리트 효과. 총 쏘기·달리기·루팅·낚시·제작 등 모든 행동이 경험치가 되어 영구 패시브 보너스가 붙습니다. F6 스킬 창(제목줄을 마우스로 끌어 이동), F7 계열 전환. 경험치는 세이브 슬롯별 저장. 다른 세이브에서 키운 스킬 레벨이 이번 판의 경험치 획득 속도를 올려주는 계승(로그라이크) 시스템 포함. 모든 수치는 게임 폴더의 config.ini 로 조절할 수 있습니다. 게임 코드를 패치하지 않아 다른 모드와 충돌이 적습니다. ※ AI 코딩 에이전트와 협업해 제작했습니다. 【English】 A Tarkov-style skill progression system for Escape From Duckov. 23 skills, max Lv.20, with ★Elite bonuses at max level. Shooting, sprinting, looting, fishing and crafting all grant skill XP that unlocks permanent passive bonuses. F6 opens the skill window (drag the title bar to move it), F7 switches category. XP is stored per save slot. Includes a roguelike inheritance system in which skills earned in other saves increase the XP gain rate of the current run. All values are configurable in config.ini next to the DLL. The mod does not patch game code, so it coexists well with other mods. Made in collaboration with an AI coding agent.
tags = Gameplay
